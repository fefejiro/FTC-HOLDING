name: ftc-cf-worker

on:
  pull_request:
    paths:
      - 'workers/<worker-name>/**'
      - '.github/workflows/<workflow-file>.yml'
  push:
    branches:
      - main
    paths:
      - 'workers/<worker-name>/**'
      - '.github/workflows/<workflow-file>.yml'
  workflow_dispatch:

env:
  WORKER_PATH: workers/<worker-name>
  NODE_VERSION: '22'
  WRANGLER_CONFIG: wrangler.toml

jobs:
  validate:
    name: Validate Worker build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKER_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dry-run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --config "$WRANGLER_CONFIG"

  deploy:
    name: Deploy Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKER_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config "$WRANGLER_CONFIG"
