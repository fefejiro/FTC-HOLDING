name: ftc-site Deploy

on:
  push:
    branches: [main]
    paths:
      - 'APPS/ftc-site/**'
      - 'PACKAGES/**'
      - '.github/workflows/ftc-site-deploy.yml'

concurrency:
  group: ftc-site-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy ftc-site to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build ftc-site
        working-directory: APPS/ftc-site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://unalabs.cloud
          NEXT_PUBLIC_OG_TRADES_SITE_URL: https://www.ogtradesacademy.com

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: APPS/ftc-site
          command: pages deploy .vercel/output/static --project-name=ftc-site-pages --branch=main
