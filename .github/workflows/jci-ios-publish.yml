name: Just Checking In iOS publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish the JCI iOS candidate or run a scoped App Store Connect operation
        required: true
        default: publish
        type: choice
        options:
          - publish
          - asc-status
          - asc-prepare
          - asc-submit
          - asc-withdraw

permissions:
  contents: read

concurrency:
  group: jci-ios-publish
  cancel-in-progress: false

env:
  JCI_PROJECT: APPS/just-checking-in-game/unity
  JCI_UNITY_VERSION: 6000.4.5f1

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    name: Unity export, Xcode archive, and App Store upload
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Normalize scripts and verify source metadata
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' $'s/\r$//' APPS/just-checking-in-game/scripts/*.sh
          chmod +x APPS/just-checking-in-game/scripts/*.sh
          grep -q 'bundleVersion: 1.2.0' "$JCI_PROJECT/ProjectSettings/ProjectSettings.asset"
          grep -q 'iPhone: 6' "$JCI_PROJECT/ProjectSettings/ProjectSettings.asset"
          grep -q 'iPhone: com.ftcholding.justcheckingin' "$JCI_PROJECT/ProjectSettings/ProjectSettings.asset"

      - name: Fail fast if release credentials are not configured
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.JCI_UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.JCI_UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.JCI_UNITY_PASSWORD }}
          APPLE_TEAM: ${{ secrets.JCI_APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.JCI_APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.JCI_APPLE_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.JCI_APPLE_API_PRIVATE_KEY }}
          SIGNING_CERTIFICATE: ${{ secrets.JOBAGENT_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.JOBAGENT_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.JOBAGENT_IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for pair in \
            JCI_UNITY_LICENSE:"$UNITY_LICENSE" \
            JCI_UNITY_EMAIL:"$UNITY_EMAIL" \
            JCI_UNITY_PASSWORD:"$UNITY_PASSWORD" \
            JCI_APPLE_TEAM_ID:"$APPLE_TEAM" \
            JCI_APPLE_API_KEY_ID:"$API_KEY_ID" \
            JCI_APPLE_API_ISSUER_ID:"$API_ISSUER" \
            JCI_APPLE_API_PRIVATE_KEY:"$API_PRIVATE_KEY" \
            JCI_SIGNING_CERTIFICATE_BASE64:"$SIGNING_CERTIFICATE" \
            JCI_SIGNING_CERTIFICATE_PASSWORD:"$SIGNING_CERTIFICATE_PASSWORD" \
            JCI_SIGNING_KEYCHAIN_PASSWORD:"$SIGNING_KEYCHAIN_PASSWORD"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            [[ -n "$value" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            printf '[JCI][FAIL] Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Export iOS project with Unity 6000.4.5f1
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.JCI_UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.JCI_UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.JCI_UNITY_PASSWORD }}
          JCI_APPLE_TEAM_ID: ${{ secrets.JCI_APPLE_TEAM_ID }}
        with:
          projectPath: ${{ env.JCI_PROJECT }}
          unityVersion: ${{ env.JCI_UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: Jci.Editor.BuildScript.ExportiOS
          allowDirtyBuild: true
          cacheUnityInstallationOnMac: true

      - name: Verify Unity editor is available to the existing wrapper
        shell: bash
        run: |
          set -euo pipefail
          unity_path="$(find /Applications/Unity/Hub/Editor -path '*/6000.4.5f1/Unity.app/Contents/MacOS/Unity' -type f -print -quit 2>/dev/null || true)"
          test -n "$unity_path" || { echo '[JCI][FAIL] Unity 6000.4.5f1 was not installed by the build action'; exit 1; }
          echo "UNITY_PATH=$unity_path" >> "$GITHUB_ENV"
          "$unity_path" -version

      - name: Run the existing JCI publish wrapper
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.JCI_UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.JCI_UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.JCI_UNITY_PASSWORD }}
          JCI_SKIP_UNITY_EXPORT: "true"
          JCI_APPLE_TEAM_ID: ${{ secrets.JCI_APPLE_TEAM_ID }}
          JCI_APPLE_API_KEY_ID: ${{ secrets.JCI_APPLE_API_KEY_ID }}
          JCI_APPLE_API_ISSUER_ID: ${{ secrets.JCI_APPLE_API_ISSUER_ID }}
          JCI_APPLE_API_PRIVATE_KEY: ${{ secrets.JCI_APPLE_API_PRIVATE_KEY }}
          JCI_SIGNING_CERTIFICATE_BASE64: ${{ secrets.JOBAGENT_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          JCI_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.JOBAGENT_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          JCI_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.JOBAGENT_IOS_KEYCHAIN_PASSWORD }}
        working-directory: APPS/just-checking-in-game
        run: |
          set -euo pipefail
          license_dir="$HOME/Library/Application Support/Unity"
          mkdir -p "$license_dir"
          printf '%s\n' "$UNITY_LICENSE" > "$license_dir/Unity_lic.ulf"
          ./scripts/publish-ios-testflight.sh

      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jci-ios-publish-evidence-${{ github.run_id }}
          path: APPS/just-checking-in-game/scripts/_ops-reports
          if-no-files-found: warn
          retention-days: 30

  asc-status:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'asc-status'
    name: Read-only App Store Connect status
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Check JCI App Store Connect build and version state
        env:
          JCI_APPLE_API_KEY_ID: ${{ secrets.JCI_APPLE_API_KEY_ID }}
          JCI_APPLE_API_ISSUER_ID: ${{ secrets.JCI_APPLE_API_ISSUER_ID }}
          JCI_APPLE_API_PRIVATE_KEY: ${{ secrets.JCI_APPLE_API_PRIVATE_KEY }}
        run: node APPS/just-checking-in-game/scripts/app-store-connect-status.mjs

  asc-prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'asc-prepare'
    name: Prepare JCI 1.2.0 App Store version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Create or update the JCI App Store version
        env:
          JCI_APPLE_API_KEY_ID: ${{ secrets.JCI_APPLE_API_KEY_ID }}
          JCI_APPLE_API_ISSUER_ID: ${{ secrets.JCI_APPLE_API_ISSUER_ID }}
          JCI_APPLE_API_PRIVATE_KEY: ${{ secrets.JCI_APPLE_API_PRIVATE_KEY }}
        run: node APPS/just-checking-in-game/scripts/app-store-connect-prepare-release.mjs

  asc-submit:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'asc-submit'
    name: Submit JCI 1.2.0 for App Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Submit the prepared JCI version with automatic release
        env:
          JCI_APPLE_API_KEY_ID: ${{ secrets.JCI_APPLE_API_KEY_ID }}
          JCI_APPLE_API_ISSUER_ID: ${{ secrets.JCI_APPLE_API_ISSUER_ID }}
          JCI_APPLE_API_PRIVATE_KEY: ${{ secrets.JCI_APPLE_API_PRIVATE_KEY }}
        run: node APPS/just-checking-in-game/scripts/app-store-connect-submit-review.mjs

  asc-withdraw:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'asc-withdraw'
    name: Withdraw current JCI review submission
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Withdraw the current JCI App Store review submission
        env:
          JCI_APPLE_API_KEY_ID: ${{ secrets.JCI_APPLE_API_KEY_ID }}
          JCI_APPLE_API_ISSUER_ID: ${{ secrets.JCI_APPLE_API_ISSUER_ID }}
          JCI_APPLE_API_PRIVATE_KEY: ${{ secrets.JCI_APPLE_API_PRIVATE_KEY }}
          JCI_REVIEW_SUBMISSION_ID: 2bb0ce51-a60e-484e-81a1-f9864e295e85
        run: node APPS/just-checking-in-game/scripts/app-store-connect-withdraw-review.mjs
