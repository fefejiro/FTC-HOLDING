name: OG Trades Academy Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'APPS/og-trades-academy/**'
      - '.github/workflows/og-trades-deploy.yml'

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: APPS/og-trades-academy
        run: npm ci

      - name: Run typecheck
        working-directory: APPS/og-trades-academy
        run: npm run typecheck

      - name: Build for Cloudflare Pages
        working-directory: APPS/og-trades-academy
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: og-trades-academy-pages
          directory: APPS/og-trades-academy/.vercel/output/static
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployment
        run: |
          echo "Deployment complete. Verifying domain..."
          sleep 5
          curl -I https://www.ogtradesacademy.com/ || echo "Domain still initializing"
