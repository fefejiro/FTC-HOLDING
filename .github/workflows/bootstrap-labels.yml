name: Bootstrap Issue Labels

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/labels.yml'
      - '.github/workflows/bootstrap-labels.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
