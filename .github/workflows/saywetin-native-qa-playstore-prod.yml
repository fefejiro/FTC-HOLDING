name: SayWetin Native — PlayStore Prod

on:
  push:
    branches: [main]
    paths:
      - 'APPS/saywetin-native/**'
      - '.github/workflows/saywetin-native-qa-playstore-prod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-playstore-production:
    name: EAS build + submit to Play Store production
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash
        working-directory: APPS/saywetin-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: APPS/saywetin-native/package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces=false

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Materialize secrets
        run: |
          mkdir -p secrets
          printf '%s' "${PLAY_STORE_SERVICE_ACCOUNT_JSON}" > secrets/play-store-key.json
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.SAYWETIN_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Build Android AAB (EAS production profile)
        run: eas build --platform android --profile production --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: '1'

      - name: Submit latest Android build to Play production
        run: eas submit --platform android --profile production --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: '1'
