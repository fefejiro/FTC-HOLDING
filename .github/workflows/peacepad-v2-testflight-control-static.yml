name: PeacePad V2 TestFlight Control Static Gate

on:
  pull_request:
    paths:
      - .github/workflows/peacepad-v2-ios-testflight-build.yml
      - .github/workflows/peacepad-v2-testflight-control-static.yml
      - .github/scripts/validate-peacepad-v2-testflight-workflow.ps1
  push:
    branches:
      - main
    paths:
      - .github/workflows/peacepad-v2-ios-testflight-build.yml
      - .github/workflows/peacepad-v2-testflight-control-static.yml
      - .github/scripts/validate-peacepad-v2-testflight-workflow.ps1

permissions:
  contents: read

concurrency:
  group: peacepad-v2-testflight-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate guarded internal TestFlight build control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch proposed control definition
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$TARGET_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_SHA"
          git checkout --detach FETCH_HEAD

      - name: Validate internal TestFlight workflow contract
        shell: pwsh
        run: ./.github/scripts/validate-peacepad-v2-testflight-workflow.ps1
