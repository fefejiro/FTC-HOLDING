name: PeacePad Native Lab Gates

on:
  pull_request:
    paths:
      - "APPS/peacepad-next-native/**"
      - ".github/workflows/peacepad-native-lab-gates.yml"
  push:
    branches:
      - main
      - "feat/peacepad-native-**"
    paths:
      - "APPS/peacepad-next-native/**"
      - ".github/workflows/peacepad-native-lab-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-native:
    name: Standalone native quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Create isolated native workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/peacepad-next-native"
          mkdir -p "$RUNNER_TEMP/peacepad-next-native"
          rsync -a --delete \
            --exclude node_modules \
            --exclude .sim \
            --exclude coverage \
            APPS/peacepad-next-native/ \
            "$RUNNER_TEMP/peacepad-next-native/"

      - name: Install native dependencies in isolation
        working-directory: ${{ runner.temp }}/peacepad-next-native
        run: npm install --ignore-scripts --no-audit --no-fund --workspaces=false

      - name: Guardrails
        working-directory: ${{ runner.temp }}/peacepad-next-native
        run: npm run guardrails

      - name: Typecheck
        working-directory: ${{ runner.temp }}/peacepad-next-native
        run: npm run typecheck

      - name: Jest with coverage
        working-directory: ${{ runner.temp }}/peacepad-next-native
        run: npm run test:coverage -- --runInBand

      - name: Expo Doctor
        working-directory: ${{ runner.temp }}/peacepad-next-native
        run: npx --yes expo-doctor@latest .

      - name: Expo config and export
        working-directory: ${{ runner.temp }}/peacepad-next-native
        run: |
          npx expo config --type public --json > "$RUNNER_TEMP/peacepad-expo-config.json"
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/peacepad-ios-export"
