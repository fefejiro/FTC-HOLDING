name: PeacePad V2 iOS App Store Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read status, prepare build 12, or submit 2.0.2 for review
        required: true
        type: choice
        options: [status, prepare, submit]
      authorization:
        description: Enter STATUS, I_CONFIRM_IOS_2_0_2_PREPARE, or I_CONFIRM_IOS_2_0_2_SUBMIT
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: peacepad-v2-ios-app-store-release
  cancel-in-progress: false

jobs:
  app-store-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require exact authorization
        env:
          MODE: ${{ inputs.mode }}
          AUTHORIZATION: ${{ inputs.authorization }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE:$AUTHORIZATION" in
            status:STATUS|prepare:I_CONFIRM_IOS_2_0_2_PREPARE|submit:I_CONFIRM_IOS_2_0_2_SUBMIT) ;;
            *) exit 1 ;;
          esac

      - name: Checkout release control
        uses: actions/checkout@v4

      - name: Run PeacePad App Store operation
        env:
          ASC_API_KEY_ID: ${{ secrets.JCI_APPLE_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.JCI_APPLE_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.JCI_APPLE_API_PRIVATE_KEY }}
        run: node APPS/peacepad-next-native/scripts/app-store-connect-release.mjs "${{ inputs.mode }}"
