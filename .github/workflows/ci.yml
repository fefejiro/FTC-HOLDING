name: CI

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  una-labs-site:
    name: una-labs-site build & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies for una-labs-site
        working-directory: APPS/una-labs-site
        run: |
          npm ci

      - name: Build una-labs-site
        working-directory: APPS/una-labs-site
        run: npm run build
