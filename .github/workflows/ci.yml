name: CI

# Scoped to una-labs-site only.
# Anion changes are covered by anion-web-ci.yml.
# Other apps have their own path-filtered workflows.
on:
  push:
    branches: [ 'main' ]
    paths:
      - 'APPS/una-labs-site/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ 'main' ]
    paths:
      - 'APPS/una-labs-site/**'
      - '.github/workflows/ci.yml'

jobs:
  una-labs-site:
    name: una-labs-site build & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies for una-labs-site
        working-directory: APPS/una-labs-site
        run: |
          npm ci

      - name: Build una-labs-site
        working-directory: APPS/una-labs-site
        run: npm run build
