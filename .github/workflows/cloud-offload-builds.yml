name: Cloud Offload Builds

on:
  workflow_dispatch:
    inputs:
      run_dispatch_e2e:
        description: Run Dispatch road alerts Playwright smoke
        required: true
        default: false
        type: boolean
      upload_web_artifacts:
        description: Upload web build outputs for download
        required: true
        default: true
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - PACKAGES/**
      - APPS/dispatch/**
      - APPS/saywetin/**
      - APPS/ftc-site/**

concurrency:
  group: cloud-offload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dispatch build
        run: npm --workspace=@ftc/dispatch run build

      - name: SayWetin web verify
        run: npm --workspace=@ftc/saywetin run verify:frontend-build

      - name: FTC site build
        run: npm --workspace=@ftc/ftc-site run build

      - name: Dispatch road alerts smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_dispatch_e2e }}
        id: dispatch_e2e
        shell: bash
        run: |
          set +e
          npm --workspace=@ftc/dispatch run test:e2e:road-alerts
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Dispatch Playwright artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_dispatch_e2e && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-playwright-results
          path: |
            APPS/dispatch/test-results
            APPS/dispatch/playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail if Dispatch smoke failed
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_dispatch_e2e && steps.dispatch_e2e.outputs.exit_code != '0' }}
        run: |
          echo "Dispatch road alerts smoke failed. See uploaded artifacts."
          exit 1

      - name: Upload SayWetin web output
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_web_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: saywetin-web-dist
          path: APPS/saywetin/dist/public
          if-no-files-found: error
          retention-days: 3

      - name: Upload FTC site output
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_web_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ftc-site-next-build
          path: APPS/ftc-site/.next
          if-no-files-found: error
          retention-days: 3
