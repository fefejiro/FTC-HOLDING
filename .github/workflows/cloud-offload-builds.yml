name: Cloud Offload Builds

on:
  workflow_dispatch:
    inputs:
      workload:
        description: Selected non-production workload
        required: true
        default: repo-preflight
        type: choice
        options:
          - repo-preflight
          - peacepad-native
          - saywetin
          - dispatch
          - ftc-site
          - jobagent
      run_tests:
        description: Run the selected unit or static test gate when available
        required: true
        default: true
        type: boolean
      upload_reports:
        description: Upload non-secret reports only (retained for 3 days)
        required: true
        default: true
        type: boolean

# Manual-only by design. This replaces the old blanket pull-request offload
# lane disabled during the bleed-stop. It never deploys, submits to stores,
# contacts production, or reads release secrets.
permissions:
  contents: read

concurrency:
  group: cloud-offload-${{ github.ref }}-${{ inputs.workload }}
  cancel-in-progress: true

jobs:
  offload:
    name: ${{ inputs.workload }} preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      NPM_CONFIG_FUND: false
      NPM_CONFIG_AUDIT: false
    steps:
      # actions/checkout invokes `git submodule foreach` during credential
      # cleanup. This repository contains a historical gitlink without a
      # matching .gitmodules URL, so use a public, detached SHA checkout
      # instead. Cloud lanes do not use submodules.
      - name: Checkout exact requested source without submodules
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Setup Node 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            APPS/dispatch/package-lock.json
            APPS/saywetin/package-lock.json
            APPS/job-reply-agent/package-lock.json
            APPS/peacepad-next-native/package-lock.json

      - name: Record exact source and runtime
        run: |
          mkdir -p cloud-offload-report
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_ref=${GITHUB_REF}"
            echo "workload=${{ inputs.workload }}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "started_utc=$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          } > cloud-offload-report/manifest.txt

      - name: Run guarded selected workload
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.workload }}" in
            repo-preflight)
              npm ci --ignore-scripts
              npm run doctor
              npm run audit:secrets
              ;;
            peacepad-native)
              npm --prefix APPS/peacepad-next-native ci --ignore-scripts
              npm --prefix APPS/peacepad-next-native run guardrails
              npm --prefix APPS/peacepad-next-native run secret-scan
              npm --prefix APPS/peacepad-next-native run typecheck
              if [ "${{ inputs.run_tests }}" = "true" ]; then
                npm --prefix APPS/peacepad-next-native run test
              fi
              ;;
            saywetin)
              npm --prefix APPS/saywetin ci --ignore-scripts
              npm --prefix APPS/saywetin run check
              if [ "${{ inputs.run_tests }}" = "true" ]; then
                npm --prefix APPS/saywetin run test
              fi
              npm --prefix APPS/saywetin run verify:frontend-build
              ;;
            dispatch)
              npm --prefix APPS/dispatch ci --ignore-scripts
              npm --prefix APPS/dispatch run check
              npm --prefix APPS/dispatch run build
              ;;
            ftc-site)
              npm ci --ignore-scripts
              npm --workspace=@ftc/ftc-site run build
              ;;
            jobagent)
              npm --prefix APPS/job-reply-agent ci --ignore-scripts
              npm --prefix APPS/job-reply-agent run lint
              if [ "${{ inputs.run_tests }}" = "true" ]; then
                npm --prefix APPS/job-reply-agent run test
              fi
              npm --prefix APPS/job-reply-agent run build
              ;;
            *)
              echo "Unsupported workload" >&2
              exit 64
              ;;
          esac
          date --utc +%Y-%m-%dT%H:%M:%SZ > cloud-offload-report/completed_utc.txt

      - name: Upload non-secret report
        if: ${{ always() && inputs.upload_reports && hashFiles('cloud-offload-report/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cloud-offload-${{ inputs.workload }}-${{ github.run_id }}
          path: cloud-offload-report
          if-no-files-found: error
          retention-days: 3
