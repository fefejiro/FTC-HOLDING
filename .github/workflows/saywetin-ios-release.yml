name: SayWetin iOS release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight, existing EAS build, or existing-record upload
        required: true
        type: choice
        options:
          - inventory
          - preflight
          - build
          - submit
        default: preflight
      existing_app_store_id:
        description: Existing numeric SayWetin App Store Connect ID; never create one here
        required: true
        type: string
        default: NOT_CONFIRMED
      build_id:
        description: Existing successful EAS iOS build ID required only for submit mode
        required: false
        type: string
        default: NOT_CONFIRMED
      confirm_existing_record:
        description: Confirm that the supplied App Store ID is an existing SayWetin record
        required: true
        type: choice
        options:
          - NOT_APPROVED
          - APPROVED
        default: NOT_APPROVED
      confirm_existing_eas_capacity:
        description: Confirm that the current EAS capacity is available without an upgrade
        required: true
        type: choice
        options:
          - NOT_APPROVED
          - APPROVED
        default: NOT_APPROVED
      confirm_no_new_spend:
        description: Confirm no payment, plan upgrade, account, record, or credential creation is allowed
        required: true
        type: choice
        options:
          - NOT_APPROVED
          - APPROVED
        default: NOT_APPROVED

permissions:
  contents: read

concurrency:
  group: saywetin-ios-release
  cancel-in-progress: false

env:
  APP_PATH: APPS/saywetin-native
  BUNDLE_ID: com.saywetin.app
  EAS_PROJECT_ID: 90cce2fa-dffb-4bd3-9899-ef92da34777f
  EAS_CLI_VERSION: 24.3.0

jobs:
  preflight:
    name: Verify existing SayWetin EAS and store identity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      MODE: ${{ inputs.mode }}
      EXISTING_APP_STORE_ID: ${{ inputs.existing_app_store_id }}
      CONFIRM_EXISTING_RECORD: ${{ inputs.confirm_existing_record }}
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: APPS/saywetin-native/package-lock.json

      - name: Install app dependencies
        working-directory: ${{ env.APP_PATH }}
        run: npm ci --workspaces=false --no-audit --no-fund

      - name: Verify existing EAS project and iOS profile
        working-directory: ${{ env.APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo "Missing existing EXPO_TOKEN"; exit 1; }

          npx --yes eas-cli@"$EAS_CLI_VERSION" whoami
          npx expo config --json > "$RUNNER_TEMP/saywetin-expo-config.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/saywetin-expo-config.json', 'utf8'));
          if (config.ios?.bundleIdentifier !== process.env.BUNDLE_ID) {
            throw new Error(`Unexpected iOS bundle identifier: ${config.ios?.bundleIdentifier}`);
          }
          if (config.extra?.eas?.projectId !== process.env.EAS_PROJECT_ID) {
            throw new Error(`Unexpected EAS project ID: ${config.extra?.eas?.projectId}`);
          }
          console.log('SayWetin bundle and existing EAS project verified');
          NODE

          npx --yes eas-cli@"$EAS_CLI_VERSION" project:info --non-interactive
          npx --yes eas-cli@"$EAS_CLI_VERSION" config --platform ios --profile production-ios --json > "$RUNNER_TEMP/saywetin-eas-ios-config.json"
          grep -q 'production-ios' "$RUNNER_TEMP/saywetin-eas-ios-config.json"
          grep -q 'com.saywetin.app' "$RUNNER_TEMP/saywetin-eas-ios-config.json"
          npx --yes eas-cli@"$EAS_CLI_VERSION" build:list --platform ios --limit 5 --json > "$RUNNER_TEMP/saywetin-ios-builds.json"
          echo 'No build or store mutation performed by preflight.'

      - name: Inventory existing App Store record (read-only)
        if: ${{ inputs.mode == 'inventory' }}
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.JOBAGENT_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.JOBAGENT_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.JOBAGENT_ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ASC_KEY_ID:-}" || { echo 'Missing existing JOBAGENT_ASC_KEY_ID'; exit 1; }
          test -n "${ASC_ISSUER_ID:-}" || { echo 'Missing existing JOBAGENT_ASC_ISSUER_ID'; exit 1; }
          test -n "${ASC_PRIVATE_KEY_BASE64:-}" || { echo 'Missing existing JOBAGENT_ASC_PRIVATE_KEY_BASE64'; exit 1; }
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';

          const b64url = (value) => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = b64url(JSON.stringify({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' }));
          const payload = b64url(JSON.stringify({
            iss: process.env.ASC_ISSUER_ID,
            iat: now,
            exp: now + 900,
            aud: 'appstoreconnect-v1',
          }));
          const unsigned = `${header}.${payload}`;
          const key = Buffer.from(process.env.ASC_PRIVATE_KEY_BASE64, 'base64').toString('utf8');
          const signature = crypto.sign('sha256', Buffer.from(unsigned), { key, dsaEncoding: 'ieee-p1363' });
          const token = `${unsigned}.${signature.toString('base64url')}`;
          const url = new URL('https://api.appstoreconnect.apple.com/v1/apps');
          url.searchParams.set('filter[bundleId]', process.env.BUNDLE_ID);
          const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
          const body = await response.json();
          if (!response.ok) throw new Error(`App Store Connect lookup failed with HTTP ${response.status}`);
          const matches = (body.data ?? []).map((app) => ({
            id: app.id,
            bundleId: app.attributes?.bundleId,
            name: app.attributes?.name,
            sku: app.attributes?.sku,
          }));
          console.log(JSON.stringify({ bundleId: process.env.BUNDLE_ID, matches }, null, 2));
          if (matches.length > 1) throw new Error('More than one App Store record matched the bundle ID');
          NODE
          echo 'Read-only inventory complete; no app record was created or changed.'

      - name: Verify existing App Store record for submit mode
        if: ${{ inputs.mode == 'submit' }}
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.JOBAGENT_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.JOBAGENT_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.JOBAGENT_ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test "$CONFIRM_EXISTING_RECORD" = APPROVED || { echo 'Submit requires confirmation of an existing App Store record.'; exit 1; }
          [[ "$EXISTING_APP_STORE_ID" =~ ^[0-9]+$ ]] || { echo 'Submit requires a numeric existing_app_store_id.'; exit 1; }
          test -n "${ASC_KEY_ID:-}" || { echo 'Missing existing JOBAGENT_ASC_KEY_ID'; exit 1; }
          test -n "${ASC_ISSUER_ID:-}" || { echo 'Missing existing JOBAGENT_ASC_ISSUER_ID'; exit 1; }
          test -n "${ASC_PRIVATE_KEY_BASE64:-}" || { echo 'Missing existing JOBAGENT_ASC_PRIVATE_KEY_BASE64'; exit 1; }

          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';

          const b64url = (value) => Buffer.from(value).toString('base64url');
          const header = b64url(JSON.stringify({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' }));
          const payload = b64url(JSON.stringify({
            iss: process.env.ASC_ISSUER_ID,
            iat: Math.floor(Date.now() / 1000),
            exp: Math.floor(Date.now() / 1000) + 900,
            aud: 'appstoreconnect-v1',
          }));
          const signingInput = `${header}.${payload}`;
          const key = Buffer.from(process.env.ASC_PRIVATE_KEY_BASE64, 'base64').toString('utf8');
          const signature = crypto.sign('sha256', Buffer.from(signingInput), { key, dsaEncoding: 'ieee-p1363' });
          const token = `${signingInput}.${signature.toString('base64url')}`;

          const response = await fetch(`https://api.appstoreconnect.apple.com/v1/apps/${process.env.EXISTING_APP_STORE_ID}`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const body = await response.json();
          if (!response.ok) {
            throw new Error(`Existing App Store record lookup failed with HTTP ${response.status}`);
          }
          const app = body.data;
          if (!app || app.id !== process.env.EXISTING_APP_STORE_ID) {
            throw new Error('App Store response did not match the supplied existing_app_store_id');
          }
          if (app.attributes?.bundleId !== process.env.BUNDLE_ID) {
            throw new Error(`App Store bundle mismatch: ${app.attributes?.bundleId}`);
          }
          console.log(`Existing App Store record verified for bundle ${process.env.BUNDLE_ID}`);
          NODE

      - name: Enforce build and submit authorization
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == build || "$MODE" == submit ]]; then
            test "${{ inputs.confirm_existing_eas_capacity }}" = APPROVED || { echo 'Build/submit requires confirmation of existing EAS capacity.'; exit 1; }
            test "${{ inputs.confirm_no_new_spend }}" = APPROVED || { echo 'Build/submit requires explicit no-new-spend approval.'; exit 1; }
          fi
          echo "mode=$MODE"
          echo 'No account, app record, API, credential, or plan creation is permitted.'

  build:
    name: Start existing EAS iOS build
    if: ${{ inputs.mode == 'build' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        working-directory: ${{ env.APP_PATH }}
        run: npm ci --workspaces=false --no-audit --no-fund

      - name: Start only the existing EAS project build
        working-directory: ${{ env.APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@"$EAS_CLI_VERSION" build \
            --platform ios \
            --profile production-ios \
            --non-interactive \
            --wait | tee "$RUNNER_TEMP/saywetin-eas-build.log"

      - name: Upload EAS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saywetin-ios-eas-build-log
          path: ${{ runner.temp }}/saywetin-eas-build.log
          if-no-files-found: warn
          retention-days: 14

  submit:
    name: Upload existing signed build to existing App Store record
    if: ${{ inputs.mode == 'submit' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXISTING_APP_STORE_ID: ${{ inputs.existing_app_store_id }}
      BUILD_ID: ${{ inputs.build_id }}
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        working-directory: ${{ env.APP_PATH }}
        run: npm ci --workspaces=false --no-audit --no-fund

      - name: Bind EAS submit profile to the verified existing record
        working-directory: ${{ env.APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_ID" != NOT_CONFIRMED && -n "$BUILD_ID" ]] || { echo 'Submit requires an existing successful EAS build_id.'; exit 1; }
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'eas.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.submit ??= {};
          config.submit['production-ios'] = {
            ...(config.submit['production-ios'] ?? {}),
            ios: {
              ...(config.submit['production-ios']?.ios ?? {}),
              ascAppId: process.env.EXISTING_APP_STORE_ID,
            },
          };
          fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Upload existing build only
        working-directory: ${{ env.APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@"$EAS_CLI_VERSION" submit \
            --platform ios \
            --profile production-ios \
            --id "$BUILD_ID" \
            --non-interactive \
            --wait | tee "$RUNNER_TEMP/saywetin-eas-submit.log"
          echo 'Upload completed, if the command succeeded. App Review submission and public release remain owner actions.'

      - name: Upload EAS submit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saywetin-ios-eas-submit-log
          path: ${{ runner.temp }}/saywetin-eas-submit.log
          if-no-files-found: warn
          retention-days: 14
