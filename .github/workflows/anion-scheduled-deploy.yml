name: anion-scheduled-deploy

on:
  schedule:
    # 8pm EST = 01:00 UTC (UTC-5). During EDT (summer) this fires at 9pm EDT.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

jobs:
  deploy:
    name: Deploy Anion to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Diagnose tree
        run: |
          pwd
          ls -la
          echo "---APPS---"
          ls -la APPS || echo "APPS missing"
          echo "---APPS/anion---"
          ls -la APPS/anion 2>/dev/null | head -20 || echo "APPS/anion missing"
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js
        run: npm --workspace=@ftc/anion run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.ANION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.ANION_SUPABASE_ANON_KEY }}
      - name: Build Cloudflare Worker
        run: npm --workspace=@ftc/anion run build:worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.ANION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.ANION_SUPABASE_ANON_KEY }}
      - name: Deploy to Cloudflare Workers
        run: npm --workspace=@ftc/anion run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
