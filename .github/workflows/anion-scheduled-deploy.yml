name: anion-scheduled-deploy

on:
  schedule:
    # 8pm EST = 01:00 UTC (UTC-5). During EDT (summer) this fires at 9pm EDT.
    # Adjust to "0 0 * * *" if you want 8pm EDT year-round instead.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

jobs:
  deploy:
    name: Trigger Railway deploy for Anion
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway deploy hook
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_ANION }}")
          echo "Railway responded with HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "Deploy hook returned unexpected status: $HTTP_STATUS"
            exit 1
          fi
          echo "Anion deploy triggered successfully."
