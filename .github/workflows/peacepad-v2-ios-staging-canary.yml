name: PeacePad Native V2 iOS Staging Canary

on:
  workflow_dispatch:
    inputs:
      region:
        description: Fictional regional staging environment embedded in the reviewed build
        required: true
        type: choice
        options:
          - ca
          - us
      target_sha:
        description: Exact reviewed feature commit containing the source and UI contract to verify
        required: true
        type: string
      build_source_sha:
        description: Exact feature commit used to create the regional EAS Simulator build
        required: true
        type: string
      eas_build_id:
        description: Exact finished regional staging EAS iOS Simulator build ID
        required: true
        type: string
      artifact_url:
        description: Exact time-limited public EAS artifact URL for that build
        required: true
        type: string
      artifact_sha256:
        description: Expected SHA-256 of that Simulator archive
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: peacepad-v2-ios-staging-canary-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  staging-auth-canary:
    name: Verify ${{ inputs.region }} staging sign-in boundary
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout exact reviewed feature commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Bind exact source and regional staging contract
        id: contract
        shell: bash
        env:
          REGION: ${{ inputs.region }}
          TARGET_SHA: ${{ inputs.target_sha }}
          BUILD_SOURCE_SHA: ${{ inputs.build_source_sha }}
        run: |
          set -euo pipefail

          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "target_sha must be an exact lowercase 40-character commit SHA." >&2
            exit 1
          }
          [[ "$BUILD_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "build_source_sha must be an exact lowercase 40-character commit SHA." >&2
            exit 1
          }

          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git cat-file -e "$BUILD_SOURCE_SHA^{commit}"
          git diff --quiet "$BUILD_SOURCE_SHA" "$TARGET_SHA" -- \
            APPS/peacepad-next-native \
            ':(exclude)APPS/peacepad-next-native/docs/**'

          case "$REGION" in
            ca)
              EXPECTED_REGION_LABEL="Canada staging"
              EXPECTED_PROFILE="staging-simulator-ca"
              EXPECTED_EAS_ENVIRONMENT="preview"
              EXPECTED_PROJECT_REF="rohvkyuxbnqzglaromms"
              ;;
            us)
              EXPECTED_REGION_LABEL="United States staging"
              EXPECTED_PROFILE="staging-simulator-us"
              EXPECTED_EAS_ENVIRONMENT="development"
              EXPECTED_PROJECT_REF="spmpndalcvwmygznihec"
              ;;
            *) echo "Unsupported staging region: $REGION" >&2; exit 1 ;;
          esac

          REGION="$REGION" \
          EXPECTED_PROFILE="$EXPECTED_PROFILE" \
          EXPECTED_EAS_ENVIRONMENT="$EXPECTED_EAS_ENVIRONMENT" \
          node <<'NODE'
          const fs = require("node:fs");
          const eas = JSON.parse(fs.readFileSync("APPS/peacepad-next-native/eas.json", "utf8"));
          const profile = eas.build?.[process.env.EXPECTED_PROFILE];
          if (
            profile?.distribution !== "internal"
            || profile?.environment !== process.env.EXPECTED_EAS_ENVIRONMENT
            || profile?.ios?.simulator !== true
          ) {
            throw new Error(`Invalid ${process.env.REGION} staging Simulator build profile.`);
          }
          if (eas.submit) throw new Error("Staging source must not define an EAS submit profile.");
          NODE

          node APPS/peacepad-next-native/scripts/check-lab-guardrails.cjs
          node APPS/peacepad-next-native/scripts/check-secrets.cjs

          {
            echo "expected_region_label=$EXPECTED_REGION_LABEL"
            echo "expected_profile=$EXPECTED_PROFILE"
            echo "expected_project_ref=$EXPECTED_PROJECT_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify and download exact regional EAS artifact
        id: artifact
        shell: bash
        env:
          EAS_BUILD_ID: ${{ inputs.eas_build_id }}
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          set -euo pipefail

          [[ "$EAS_BUILD_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || {
            echo "eas_build_id must be an exact lowercase UUID." >&2
            exit 1
          }
          case "$ARTIFACT_URL" in
            https://expo.dev/artifacts/eas/*.tar.gz) ;;
            *) echo "Artifact URL is outside the guarded EAS origin." >&2; exit 1 ;;
          esac
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "artifact_sha256 must be an exact 64-character hexadecimal digest." >&2
            exit 1
          }

          ARCHIVE_PATH="$RUNNER_TEMP/peacepad-staging-eas-simulator.tar.gz"
          EXTRACT_PATH="$RUNNER_TEMP/peacepad-staging-eas-simulator"
          mkdir -p "$EXTRACT_PATH"
          curl --fail --location --retry 3 --silent --show-error \
            "$ARTIFACT_URL" \
            --output "$ARCHIVE_PATH"

          ACTUAL_SHA256="$(shasum -a 256 "$ARCHIVE_PATH" | awk '{print $1}')"
          EXPECTED_SHA256="$(printf '%s' "$EXPECTED_SHA256" | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          tar -xzf "$ARCHIVE_PATH" -C "$EXTRACT_PATH"

          APP_PATH="$(find "$EXTRACT_PATH" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          test "$BUNDLE_ID" = "ca.peacepad.nextnative.lab"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP_PATH/Info.plist")" = "false"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP_PATH/Info.plist")"

          {
            echo "app_path=$APP_PATH"
            echo "actual_sha256=$ACTUAL_SHA256"
            echo "bundle_id=$BUNDLE_ID"
            echo "app_version=$APP_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Boot isolated iOS Simulator and install PeacePad
        id: simulator
        shell: bash
        env:
          APP_PATH: ${{ steps.artifact.outputs.app_path }}
        run: |
          set -euo pipefail

          RUNTIME_ID="$(xcrun simctl list runtimes --json | jq -er \
            '[.runtimes[] | select(.platform == "iOS" and .isAvailable == true)] | last | .identifier')"
          DEVICE_TYPE_ID="$(xcrun simctl list devicetypes --json | jq -er \
            '[.devicetypes[] | select(.name | startswith("iPhone"))] | first | .identifier')"
          DEVICE_NAME="PeacePad V2 Staging ${{ inputs.region }} Evidence"
          DEVICE_UDID="$(xcrun simctl create "$DEVICE_NAME" "$DEVICE_TYPE_ID" "$RUNTIME_ID")"

          echo "$DEVICE_UDID" > "$RUNNER_TEMP/peacepad-staging-simulator-udid"
          echo "device_udid=$DEVICE_UDID" >> "$GITHUB_OUTPUT"
          echo "runtime_id=$RUNTIME_ID" >> "$GITHUB_OUTPUT"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$DEVICE_UDID"
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_UDID"
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl get_app_container "$DEVICE_UDID" ca.peacepad.nextnative.lab app

      - name: Install Maestro
        shell: bash
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version

      - name: Verify regional staging label and live invalid-auth boundary
        shell: bash
        env:
          DEVICE_UDID: ${{ steps.simulator.outputs.device_udid }}
          EXPECTED_REGION_LABEL: ${{ steps.contract.outputs.expected_region_label }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail

          EVIDENCE_DIR="$RUNNER_TEMP/peacepad-staging-canary-evidence"
          LANDING_FLOW_PATH="$RUNNER_TEMP/peacepad-staging-auth-landing.yaml"
          INVALID_AUTH_FLOW_PATH="$RUNNER_TEMP/peacepad-staging-invalid-auth.yaml"
          FICTIONAL_EMAIL="peacepad-canary-${REGION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test"
          FICTIONAL_PASSWORD="CanaryOnly${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$EVIDENCE_DIR"

          cat > "$LANDING_FLOW_PATH" <<YAML
          appId: ca.peacepad.nextnative.lab
          ---
          - launchApp:
              clearState: true
          - extendedWaitUntil:
              visible: "Sign in to staging"
              timeout: 60000
          - assertVisible:
              id: "staging-region-label"
          - assertVisible: "$EXPECTED_REGION_LABEL"
          - assertVisible: "Use a fictional PeacePad staging account. Real family information is not permitted."
          YAML

          cat > "$INVALID_AUTH_FLOW_PATH" <<YAML
          appId: ca.peacepad.nextnative.lab
          ---
          - tapOn: "Staging email"
          - inputText: "$FICTIONAL_EMAIL"
          - tapOn: "Staging password"
          - inputText: "$FICTIONAL_PASSWORD"
          - tapOn: "Sign in"
          - extendedWaitUntil:
              visible: "Check the fictional staging email and password."
              timeout: 30000
          - assertVisible: "$EXPECTED_REGION_LABEL"
          - assertVisible: "Sign in to staging"
          YAML

          "$HOME/.maestro/bin/maestro" \
            --device "$DEVICE_UDID" \
            test \
            "$LANDING_FLOW_PATH"
          xcrun simctl io "$DEVICE_UDID" screenshot \
            "$EVIDENCE_DIR/01-${REGION}-staging-sign-in.png"

          "$HOME/.maestro/bin/maestro" \
            --device "$DEVICE_UDID" \
            test \
            "$INVALID_AUTH_FLOW_PATH"
          xcrun simctl io "$DEVICE_UDID" screenshot \
            "$EVIDENCE_DIR/02-${REGION}-invalid-auth.png"

          test -f "$EVIDENCE_DIR/01-${REGION}-staging-sign-in.png"
          test -f "$EVIDENCE_DIR/02-${REGION}-invalid-auth.png"

          MAESTRO_VERSION="$("$HOME/.maestro/bin/maestro" --version | tail -n 1)"
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg result "SIMULATOR_STAGING_AUTH_CANARY_VERIFIED" \
            --arg generatedAt "$GENERATED_AT" \
            --arg controlSha "$GITHUB_SHA" \
            --arg targetSha "${{ inputs.target_sha }}" \
            --arg buildSourceSha "${{ inputs.build_source_sha }}" \
            --arg easBuildId "${{ inputs.eas_build_id }}" \
            --arg artifactUrl "${{ inputs.artifact_url }}" \
            --arg artifactSha256 "${{ steps.artifact.outputs.actual_sha256 }}" \
            --arg bundleId "${{ steps.artifact.outputs.bundle_id }}" \
            --arg appVersion "${{ steps.artifact.outputs.app_version }}" \
            --arg region "$REGION" \
            --arg regionLabel "$EXPECTED_REGION_LABEL" \
            --arg projectRef "${{ steps.contract.outputs.expected_project_ref }}" \
            --arg simulatorUdid "$DEVICE_UDID" \
            --arg simulatorRuntime "${{ steps.simulator.outputs.runtime_id }}" \
            --arg maestroVersion "$MAESTRO_VERSION" \
            '{
              result: $result,
              generatedAt: $generatedAt,
              controlSha: $controlSha,
              targetSha: $targetSha,
              buildSourceSha: $buildSourceSha,
              easBuildId: $easBuildId,
              artifactUrl: $artifactUrl,
              artifactSha256: $artifactSha256,
              bundleId: $bundleId,
              appVersion: $appVersion,
              region: $region,
              regionLabel: $regionLabel,
              expectedProjectRef: $projectRef,
              simulatorUdid: $simulatorUdid,
              simulatorRuntime: $simulatorRuntime,
              maestroVersion: $maestroVersion,
              scope: [
                "isolated Simulator install and cold launch",
                "exact regional staging label",
                "English staging sign-in UI",
                "live Supabase Auth invalid-credential response"
              ],
              fixture: {
                domain: "example.test",
                personalData: false,
                credentialRetained: false
              },
              accountCreationOperationAttempted: false,
              applicationDataMutationAttempted: false,
              productionContacted: false,
              deviceProof: false,
              testFlightProof: false,
              productionProof: false
            }' > "$EVIDENCE_DIR/manifest.json"

      - name: Capture failure boundary
        if: failure()
        shell: bash
        env:
          REGION: ${{ inputs.region }}
        run: |
          set +e
          EVIDENCE_DIR="$RUNNER_TEMP/peacepad-staging-canary-evidence"
          mkdir -p "$EVIDENCE_DIR"
          if test -f "$RUNNER_TEMP/peacepad-staging-simulator-udid"; then
            DEVICE_UDID="$(cat "$RUNNER_TEMP/peacepad-staging-simulator-udid")"
            xcrun simctl io "$DEVICE_UDID" screenshot \
              "$EVIDENCE_DIR/failure-${REGION}-final-state.png"
          fi
          if ! test -f "$EVIDENCE_DIR/manifest.json"; then
            jq -n \
              --arg result "SIMULATOR_STAGING_AUTH_CANARY_NOT_VERIFIED" \
              --arg controlSha "$GITHUB_SHA" \
              --arg targetSha "${{ inputs.target_sha }}" \
              --arg buildSourceSha "${{ inputs.build_source_sha }}" \
              --arg easBuildId "${{ inputs.eas_build_id }}" \
              --arg artifactUrl "${{ inputs.artifact_url }}" \
              --arg expectedArtifactSha256 "${{ inputs.artifact_sha256 }}" \
              --arg region "$REGION" \
              '{
                result: $result,
                controlSha: $controlSha,
                targetSha: $targetSha,
                buildSourceSha: $buildSourceSha,
                easBuildId: $easBuildId,
                artifactUrl: $artifactUrl,
                expectedArtifactSha256: $expectedArtifactSha256,
                region: $region,
                productionContacted: null,
                deviceProof: false,
                testFlightProof: false,
                productionProof: false
              }' > "$EVIDENCE_DIR/manifest.json"
          fi

      - name: Upload non-secret staging canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peacepad-v2-ios-staging-${{ inputs.region }}-${{ inputs.eas_build_id }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/peacepad-staging-canary-evidence

      - name: Destroy isolated Simulator
        if: always()
        shell: bash
        run: |
          set +e
          if test -f "$RUNNER_TEMP/peacepad-staging-simulator-udid"; then
            DEVICE_UDID="$(cat "$RUNNER_TEMP/peacepad-staging-simulator-udid")"
            xcrun simctl shutdown "$DEVICE_UDID"
            xcrun simctl delete "$DEVICE_UDID"
          fi
