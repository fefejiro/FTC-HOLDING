name: PeacePad V2 Android Play Production Upload

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact reviewed Native V2 Git ref that produced the AAB
        required: true
        type: string
      source_sha:
        description: Exact full Native V2 SHA expected after checkout
        required: true
        type: string
      eas_build_id:
        description: Finished EAS Android AAB build ID from playstore-production
        required: true
        type: string
      artifact_url:
        description: Optional exact EAS artifact URL from a previously verified production AAB build
        required: false
        type: string
      artifact_sha256:
        description: Required SHA-256 when artifact_url is supplied
        required: false
        type: string
      release_authorization:
        description: Enter I_CONFIRM_CANADA_PRODUCTION_AAB_UPLOAD to upload only to Play Internal Testing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: peacepad-v2-android-production-play-upload
  cancel-in-progress: false

jobs:
  upload-production-aab:
    name: Upload reviewed production AAB to Google Play Internal Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require explicit production upload authorization
        env:
          AUTHORIZATION: ${{ inputs.release_authorization }}
        shell: bash
        run: |
          set -euo pipefail
          test "$AUTHORIZATION" = "I_CONFIRM_CANADA_PRODUCTION_AAB_UPLOAD"

      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Bind upload control to the supplied source SHA
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: APPS/peacepad-next-native/package-lock.json

      - name: Package and validate only the reviewed Native V2 tree
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/peacepad-next-native-release"
          mkdir -p "$release_root"
          git archive "$EXPECTED_SHA:APPS/peacepad-next-native" | tar -x -C "$release_root"
          npm --prefix "$release_root" ci --ignore-scripts --no-audit --no-fund --workspaces=false
          (
            cd "$release_root"
            export EXPO_PUBLIC_PEACEPAD_ENV=production
            export EXPO_PUBLIC_PEACEPAD_PRODUCTION_WRITES_ENABLED=true
            export PEACEPAD_ANDROID_RELEASE_MODE=playstore-production
            node scripts/check-lab-guardrails.cjs
          )

      - name: Require the PeacePad Play upload credential
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PEACEPAD_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PLAY_SERVICE_ACCOUNT"
          node -e 'JSON.parse(process.env.PLAY_SERVICE_ACCOUNT);'

      - name: Require the Canada production write boundary
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --location --retry 3 --connect-timeout 20 --max-time 60 \
            https://qzekqjewpugdotskrtni.supabase.co/functions/v1/peacepad-v2-api/health)"
          node -e 'const health=JSON.parse(process.argv[1]); if(health.status!=="ok"||health.environment!=="production"||health.region!=="ca"||health.writesEnabled!==true) process.exit(1)' "$health"

      - name: Fetch and validate the exact finished EAS AAB
        id: fetch_eas
        if: ${{ inputs.artifact_url == '' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_ID: ${{ inputs.eas_build_id }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@21.8.0 build:view "$EAS_BUILD_ID" --json > "$RUNNER_TEMP/peacepad-v2-android-production-build.json"
          node - <<'NODE'
          const fs = require('fs');
          const build = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/peacepad-v2-android-production-build.json', 'utf8'));
          const ok = build.id === process.env.EAS_BUILD_ID
            && build.status === 'FINISHED'
            && build.platform === 'ANDROID'
            && build.distribution === 'STORE'
            && build.buildProfile === 'playstore-production'
            && build.appVersion === '2.0.1'
            && String(build.appBuildVersion) === '44'
            && build.project?.ownerAccount?.name === 'official_fejiro'
            && build.project?.slug === 'peacepad-next-native-lab'
            && typeof build.artifacts?.buildUrl === 'string';
          if (!ok) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_url=${build.artifacts.buildUrl}\n`);
          NODE
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 600 "$(node -e 'const fs=require("fs");const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/peacepad-v2-android-production-build.json","utf8"));process.stdout.write(b.artifacts.buildUrl)')" -o "$RUNNER_TEMP/peacepad-v2-production-release.aab"
          test -s "$RUNNER_TEMP/peacepad-v2-production-release.aab"
          keytool -printcert -jarfile "$RUNNER_TEMP/peacepad-v2-production-release.aab" > "$RUNNER_TEMP/peacepad-v2-production-release-certificate.txt"

      - name: Fetch and validate previously verified exact AAB
        if: ${{ inputs.artifact_url != '' }}
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
          EAS_BUILD_ID: ${{ inputs.eas_build_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_URL"
          test -n "$EXPECTED_SHA256"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "$ARTIFACT_URL" -o "$RUNNER_TEMP/peacepad-v2-production-release.aab"
          test -s "$RUNNER_TEMP/peacepad-v2-production-release.aab"
          actual_sha256="$(sha256sum "$RUNNER_TEMP/peacepad-v2-production-release.aab" | awk '{print toupper($1)}')"
          test "$actual_sha256" = "$(printf '%s' "$EXPECTED_SHA256" | tr '[:lower:]' '[:upper:]')"
          cat > "$RUNNER_TEMP/peacepad-v2-android-production-build.json" <<EOF
          {"id":"$EAS_BUILD_ID","status":"FINISHED","platform":"ANDROID","distribution":"STORE","buildProfile":"playstore-production","appVersion":"2.0.1","appBuildVersion":"44","artifact_sha256":"$actual_sha256","artifacts":{"buildUrl":"$ARTIFACT_URL"}}
          EOF
          keytool -printcert -jarfile "$RUNNER_TEMP/peacepad-v2-production-release.aab" > "$RUNNER_TEMP/peacepad-v2-production-release-certificate.txt"

      - name: Upload only to Google Play Internal Testing
        id: upload
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PEACEPAD_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ca.peacepad.family
          releaseFiles: ${{ runner.temp }}/peacepad-v2-production-release.aab
          track: internal
          status: completed

      - name: Write non-secret production upload evidence
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          EAS_BUILD_ID: ${{ inputs.eas_build_id }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/peacepad-v2-android-production-upload.manifest" <<EOF
          source_sha=$EXPECTED_SHA
          eas_build_id=$EAS_BUILD_ID
          package=ca.peacepad.family
          version=2.0.1
          version_code=44
          track=internal
          production_writes_enabled=true
          upload_outcome=$UPLOAD_OUTCOME
          EOF

      - name: Upload non-secret release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peacepad-v2-android-production-upload-${{ inputs.source_sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/peacepad-v2-android-production-build.json
            ${{ runner.temp }}/peacepad-v2-production-release-certificate.txt
            ${{ runner.temp }}/peacepad-v2-android-production-upload.manifest
