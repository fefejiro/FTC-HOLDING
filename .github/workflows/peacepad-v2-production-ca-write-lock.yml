name: PeacePad V2 Canada Production Boundary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/peacepad-v2-production-ca-write-lock.yml"

permissions:
  contents: read

concurrency:
  group: peacepad-v2-production-ca-write-lock
  cancel-in-progress: false

jobs:
  verify-write-lock:
    name: Verify Canada production remains healthy and authorization-closed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Use Supabase's dedicated Functions hostname so hosted runners do not
      # traverse the general project gateway that intermittently returned 503.
      API_BASE_URL: https://rohvkyuxbnqzglaromms.supabase.co/functions/v1/peacepad-v2-api
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.PEACEPAD_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Verify health and readiness boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          for route in health readyz; do
            response="$(curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 2 \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              "$API_BASE_URL/$route")"
            jq -e '
              .status == (if $route == "health" then "ok" else "ready" end)
              and .environment == "production"
              and .region == "ca"
              and .writesEnabled == true
            ' --arg route "$route" <<<"$response" >/dev/null
          done

      - name: Verify unauthenticated writes remain rejected
        shell: bash
        run: |
          set -euo pipefail
          body_path="$RUNNER_TEMP/write-lock-response.json"
          status="$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --output "$body_path" \
            --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'content-type: application/json' \
            --data '{}' \
            "$API_BASE_URL/api/v2/invitations")"
          test "$status" = "401"
          jq -e '
            .error.code == "AUTH_REQUIRED"
            and (.error.requestId | type == "string" and length > 0)
          ' "$body_path" >/dev/null

      - name: Publish non-secret boundary evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## PeacePad V2 Canada production write lock"
            echo
            echo "- Project: \`rohvkyuxbnqzglaromms\`"
            echo "- Expected environment: \`production\`"
            echo "- Expected region: \`ca\`"
            echo "- Expected writes enabled: \`true\`"
            echo "- Verified at: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
