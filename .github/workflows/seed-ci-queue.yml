name: Seed Continuous Improvement Queue

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: seed-continuous-improvement
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Seed CI queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATE_ISSUES: '1'
          CI_SEED_LIMIT: '3'
        run: node scripts/seed-continuous-improvement.mjs
