name: Seed Continuous Improvement Queue

on:
  schedule:
    # Sunday 23:00 ET = Monday 03:00 UTC (during EST). Drift in DST is acceptable.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Seed CI queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/seed-continuous-improvement.mjs
