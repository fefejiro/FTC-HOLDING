name: Continuous Improvement — Nightly Auto-Assign

on:
  schedule:
    # 02:00 ET = 06:00 UTC (during EST). DST drift acceptable.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  graze:
    runs-on: ubuntu-latest
    steps:
      - name: Pick top 3 unassigned `continuous-improvement` issues and assign @copilot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Top 3 oldest open, unassigned, labeled `continuous-improvement`
          issues=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label continuous-improvement \
            --search "no:assignee" \
            --limit 3 \
            --json number \
            --jq '.[].number')
          if [ -z "$issues" ]; then
            echo "No unassigned continuous-improvement issues. Done."
            exit 0
          fi
          for n in $issues; do
            echo "Assigning @copilot to issue #$n"
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --add-assignee copilot || \
              echo "(could not assign #$n — copilot may not be available on this repo)"
          done
