name: Continuous Improvement - Assign Reviewed Issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Reviewed issue number to assign'
        required: true
        type: string
      confirm_assignment:
        description: 'Type ASSIGN to confirm possible Copilot usage'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: continuous-improvement-agent
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and assign one reviewed issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CONFIRM_ASSIGNMENT: ${{ inputs.confirm_assignment }}
        run: |
          set -e
          if [ "$CONFIRM_ASSIGNMENT" != "ASSIGN" ]; then
            echo "Confirmation must be ASSIGN."
            exit 1
          fi
          issue=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,assignees,labels,body)
          state=$(echo "$issue" | jq -r '.state')
          assignees=$(echo "$issue" | jq '.assignees | length')
          has_ci=$(echo "$issue" | jq '[.labels[].name] | index("continuous-improvement") != null')
          has_ready=$(echo "$issue" | jq '[.labels[].name] | index("agent-ready") != null')
          if [ "$state" != "OPEN" ] || [ "$assignees" != "0" ] || \
             [ "$has_ci" != "true" ] || [ "$has_ready" != "true" ]; then
            echo "Issue must be open, unassigned, continuous-improvement, and agent-ready."
            exit 1
          fi
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-assignee copilot
