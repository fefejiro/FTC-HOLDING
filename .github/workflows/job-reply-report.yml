name: Job Reply — Daily Report

on:
  schedule:
    # 6 PM EST = 23:00 UTC, Mon–Fri
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}

jobs:
  daily-report:
    name: Daily Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: APPS/job-reply-agent/package-lock.json

      - name: Get date for cache key
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: APPS/job-reply-agent/data/job_leads.sqlite
          key: job-agent-db-${{ steps.date.outputs.date }}
          restore-keys: |
            job-agent-db-

      - name: Install dependencies
        run: npm --prefix APPS/job-reply-agent ci

      - name: Build
        run: npm --prefix APPS/job-reply-agent run build

      - name: Gmail report secrets preflight
        id: gmail_report_preflight
        env:
          TOKENS_JSON: ${{ secrets.JOB_AGENT_GMAIL_TOKENS_JSON }}
          CLIENT_ID: ${{ secrets.JOB_AGENT_GMAIL_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.JOB_AGENT_GMAIL_CLIENT_SECRET }}
          ACCOUNT_EMAIL: ${{ secrets.JOB_AGENT_GMAIL_ACCOUNT_EMAIL }}
          REPORT_TO: ${{ secrets.JOB_AGENT_REPORT_TO }}
        run: |
          missing=()
          [ -n "$TOKENS_JSON" ] || missing+=("JOB_AGENT_GMAIL_TOKENS_JSON")
          [ -n "$CLIENT_ID" ] || missing+=("JOB_AGENT_GMAIL_CLIENT_ID")
          [ -n "$CLIENT_SECRET" ] || missing+=("JOB_AGENT_GMAIL_CLIENT_SECRET")
          [ -n "$ACCOUNT_EMAIL" ] || missing+=("JOB_AGENT_GMAIL_ACCOUNT_EMAIL")
          [ -n "$REPORT_TO" ] || missing+=("JOB_AGENT_REPORT_TO")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping scheduled daily report send. Missing required secret(s): ${missing[*]}"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Write Gmail tokens
        if: steps.gmail_report_preflight.outputs.ready == 'true'
        env:
          TOKENS_JSON: ${{ secrets.JOB_AGENT_GMAIL_TOKENS_JSON }}
        run: |
          mkdir -p APPS/job-reply-agent/data
          printf '%s' "$TOKENS_JSON" > APPS/job-reply-agent/data/gmail_tokens.json

      - name: Write .env
        if: steps.gmail_report_preflight.outputs.ready == 'true'
        env:
          CLIENT_ID: ${{ secrets.JOB_AGENT_GMAIL_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.JOB_AGENT_GMAIL_CLIENT_SECRET }}
          ACCOUNT_EMAIL: ${{ secrets.JOB_AGENT_GMAIL_ACCOUNT_EMAIL }}
          REPORT_TO: ${{ secrets.JOB_AGENT_REPORT_TO }}
        run: |
          printf 'GMAIL_AUTH_MODE=oauth\n' > APPS/job-reply-agent/.env
          printf 'GMAIL_CLIENT_ID=%s\n' "$CLIENT_ID" >> APPS/job-reply-agent/.env
          printf 'GMAIL_CLIENT_SECRET=%s\n' "$CLIENT_SECRET" >> APPS/job-reply-agent/.env
          printf 'GMAIL_REDIRECT_URI=http://localhost\n' >> APPS/job-reply-agent/.env
          printf 'GMAIL_TOKENS_PATH=./data/gmail_tokens.json\n' >> APPS/job-reply-agent/.env
          printf 'GMAIL_ACCOUNT_EMAIL=%s\n' "$ACCOUNT_EMAIL" >> APPS/job-reply-agent/.env
          printf 'REPORT_TO=%s\n' "$REPORT_TO" >> APPS/job-reply-agent/.env
          printf 'AGENT_TZ=America/Toronto\n' >> APPS/job-reply-agent/.env
          printf 'DAILY_REPORT_ENABLE_SEND=true\n' >> APPS/job-reply-agent/.env

      - name: Send daily report
        if: steps.gmail_report_preflight.outputs.ready == 'true'
        working-directory: APPS/job-reply-agent
        run: |
          if ! node dist/main.js report:daily; then
            echo "::warning::Daily report send did not complete. Most common cause is expired/revoked OAuth tokens; refresh JOB_AGENT_GMAIL_TOKENS_JSON and rerun."
            exit 0
          fi
