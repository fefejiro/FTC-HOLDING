name: PeacePad V2 Android Internal AAB

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact reviewed Native V2 Git ref to build
        required: true
        type: string
      source_sha:
        description: Exact full SHA expected after checkout
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: peacepad-v2-android-internal-aab
  cancel-in-progress: false

jobs:
  build-signed-internal-aab:
    name: Build signed Android AAB without Play publication
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Bind build to the supplied source SHA
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse "$EXPECTED_SHA:APPS/peacepad-next-native" > "$RUNNER_TEMP/peacepad-native-tree"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: APPS/peacepad-next-native/package-lock.json

      - name: Package only the reviewed Native V2 tree
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/peacepad-next-native-release"
          mkdir -p "$release_root"
          git archive "$EXPECTED_SHA:APPS/peacepad-next-native" | tar -x -C "$release_root"
          git -C "$release_root" init -q
          git -C "$release_root" config user.name 'PeacePad Release Control'
          git -C "$release_root" config user.email 'release-control@users.noreply.github.com'
          git -C "$release_root" add --all
          git -C "$release_root" commit -qm "Package PeacePad Native V2 source $EXPECTED_SHA"
          test "$(git -C "$release_root" rev-parse HEAD^{tree})" = "$(cat "$RUNNER_TEMP/peacepad-native-tree")"
          npm --prefix "$release_root" ci --ignore-scripts --no-audit --no-fund --workspaces=false

      - name: Write ephemeral local Android signing credentials
        working-directory: ${{ runner.temp }}/peacepad-next-native-release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PEACEPAD_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PEACEPAD_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PEACEPAD_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PEACEPAD_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/peacepad-upload.keystore"
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('credentials.json', JSON.stringify({
            android: { keystore: {
              keystorePath: process.env.RUNNER_TEMP + '/peacepad-upload.keystore',
              keystorePassword: process.env.KEYSTORE_PASSWORD,
              keyAlias: process.env.KEY_ALIAS,
              keyPassword: process.env.KEY_PASSWORD
            } }
          }));
          NODE

      - name: Verify guarded Android contract and start signed AAB build
        working-directory: ${{ runner.temp }}/peacepad-next-native-release
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
          PEACEPAD_ANDROID_RELEASE_MODE: playstore-internal
        run: |
          set -euo pipefail
          trap 'rm -f credentials.json "$RUNNER_TEMP/peacepad-upload.keystore"' EXIT
          npx --yes eas-cli@21.8.0 env:exec --environment production -- bash -lc '
            set -euo pipefail
            export PEACEPAD_ANDROID_RELEASE_MODE=playstore-internal
            node scripts/check-lab-guardrails.cjs
            node -e "const cfg=require(\"./app.config.js\")({config:require(\"./app.json\").expo}); if(cfg.android.package!==\"ca.peacepad.family\"||cfg.android.versionCode!==42||cfg.extra.productionApiWritesEnabled!==false) process.exit(1)"
            npx --yes eas-cli@21.8.0 build --platform android --profile playstore-internal --non-interactive --wait --json > "$RUNNER_TEMP/peacepad-v2-android-build.json"
          '
          node -e 'const fs=require("fs"); const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/peacepad-v2-android-build.json","utf8")); const first=Array.isArray(b)?b[0]:b; if(!first?.id||!first?.artifacts?.buildUrl) process.exit(1); fs.writeFileSync(process.env.RUNNER_TEMP+"/peacepad-v2-android-build.manifest", `source_sha=${process.env.EXPECTED_SHA||""}\nprofile=playstore-internal\npackage=ca.peacepad.family\nversion_code=42\nplay_submission_attempted=false\nbuild_id=${first.id}\nartifact_url=${first.artifacts.buildUrl}\n`);'
      - name: Upload AAB build evidence without Play submission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peacepad-v2-android-internal-${{ inputs.source_sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/peacepad-v2-android-build.json
            ${{ runner.temp }}/peacepad-v2-android-build.manifest
