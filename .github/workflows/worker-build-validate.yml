name: worker-build-validate

on:
  pull_request:
    branches: ['main']
    paths:
      - 'workers/peacepadai/**'
      - '.github/workflows/worker-build-validate.yml'
  push:
    branches: ['main']
    paths:
      - 'workers/peacepadai/**'
      - '.github/workflows/worker-build-validate.yml'
  workflow_dispatch:

jobs:
  worker-build-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate peacepadai worker build
        run: npx wrangler deploy --dry-run --config workers/peacepadai/wrangler.toml
