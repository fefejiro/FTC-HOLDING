name: PeacePad V2 Auth URL Configuration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read provider status or apply an approved Auth contract
        required: true
        default: auth-urls
        type: choice
        options:
          - auth-urls
          - provider-status
          - native-apple
          - google-provider
      project_ref:
        description: Approved PeacePad production Supabase project ref
        required: true
        default: rohvkyuxbnqzglaromms
        type: string
      confirmation:
        description: Type the exact authorization for the selected operation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: peacepad-v2-auth-url-config
  cancel-in-progress: false

jobs:
  configure-auth-urls:
    if: inputs.operation == 'auth-urls' && inputs.confirmation == 'CONFIGURE PEACEPAD AUTH URLS'
    name: Configure and verify PeacePad production Auth URLs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: peacepad-v2-staging-ca
    steps:
      - name: Validate the approved project and confirmation
        shell: bash
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "rohvkyuxbnqzglaromms"
          test "$CONFIRMATION" = "CONFIGURE PEACEPAD AUTH URLS"

      - name: Apply and read back the native redirect contract
        shell: bash
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          before="$(mktemp)"
          after="$(mktemp)"
          trap 'rm -f "$before" "$after"' EXIT
          auth_header="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"

          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 60 \
            --header "$auth_header" --header 'accept: application/json' \
            "$api" --output "$before"
          jq -e 'has("site_url") and has("uri_allow_list")' "$before" >/dev/null

          payload="$(jq -cn \
            '{site_url:"https://peacepad.ca", uri_allow_list:"peacepad://auth/confirm,peacepad://auth/reset-password,https://peacepad.ca"}')"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 60 --request PATCH \
            --header "$auth_header" --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --data "$payload" "$api" --output "$after"

          jq -e '
            .site_url == "https://peacepad.ca" and
            (.uri_allow_list | split(",") | index("peacepad://auth/confirm")) and
            (.uri_allow_list | split(",") | index("peacepad://auth/reset-password")) and
            (.uri_allow_list | split(",") | index("https://peacepad.ca")) and
            (.uri_allow_list | contains("localhost") | not)
          ' "$after" >/dev/null
          echo 'PeacePad Auth URL configuration verified: production site plus native confirmation and recovery redirects.'

  provider-status:
    if: inputs.operation == 'provider-status' && inputs.confirmation == 'READ PEACEPAD AUTH PROVIDER STATUS'
    name: Read PeacePad production Auth provider status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: peacepad-v2-staging-ca
    steps:
      - name: Validate the approved project and read-only authorization
        shell: bash
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "rohvkyuxbnqzglaromms"
          test "$CONFIRMATION" = "READ PEACEPAD AUTH PROVIDER STATUS"

      - name: Read and redact provider configuration
        shell: bash
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 60 \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'accept: application/json' "$api")"
          jq -e 'type == "object"' <<<"$response" >/dev/null
          jq -n \
            --argjson email "$(jq -c '.external_email_enabled // false' <<<"$response")" \
            --argjson google "$(jq -c '.external_google_enabled // false' <<<"$response")" \
            --argjson apple "$(jq -c '.external_apple_enabled // false' <<<"$response")" \
            --argjson manualLinking "$(jq -c '.security_manual_linking_enabled // false' <<<"$response")" \
            --argjson googleClientIds "$(jq -c '(.external_google_client_id // "") | split(",") | map(select(length > 0)) | length > 0' <<<"$response")" \
            --argjson appleClientIds "$(jq -c '(.external_apple_client_id // "") | split(",") | map(select(length > 0)) | length > 0' <<<"$response")" \
            '{
              providerStatus: "read-only",
              emailEnabled: $email,
              googleEnabled: $google,
              appleEnabled: $apple,
              manualLinkingEnabled: $manualLinking,
              googleClientAudiencePresent: $googleClientIds,
              appleClientAudiencePresent: $appleClientIds,
              secretsPrinted: false
            }'

  configure-native-apple:
    if: inputs.operation == 'native-apple' && inputs.confirmation == 'CONFIGURE PEACEPAD NATIVE APPLE PROVIDER'
    name: Configure and verify native Sign in with Apple
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: peacepad-v2-staging-ca
    steps:
      - name: Validate the approved native Apple contract
        shell: bash
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "rohvkyuxbnqzglaromms"
          test "$CONFIRMATION" = "CONFIGURE PEACEPAD NATIVE APPLE PROVIDER"

      - name: Configure native Apple and read back redacted status
        shell: bash
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          before="$(mktemp)"
          after="$(mktemp)"
          trap 'rm -f "$before" "$after"' EXIT
          auth_header="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"

          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 60 \
            --header "$auth_header" --header 'accept: application/json' \
            "$api" --output "$before"
          jq -e '.external_email_enabled == true and (.disable_signup // false) == false' "$before" >/dev/null

          payload="$(jq -cn '{
            external_apple_enabled: true,
            external_apple_client_id: "ca.peacepad.family",
            security_manual_linking_enabled: true
          }')"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 60 --request PATCH \
            --header "$auth_header" --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --data "$payload" "$api" --output "$after"

          jq -e '
            .external_email_enabled == true and
            (.disable_signup // false) == false and
            .external_apple_enabled == true and
            ((.external_apple_client_id // "") | split(",") | index("ca.peacepad.family")) and
            .security_manual_linking_enabled == true
          ' "$after" >/dev/null
          jq -n '{
            providerConfiguration: "native-apple",
            emailEnabled: true,
            appleEnabled: true,
            appleNativeAudiencePresent: true,
            manualLinkingEnabled: true,
            signupSettingUnchanged: true,
            secretsPrinted: false
          }'

  configure-google-provider:
    if: inputs.operation == 'google-provider' && inputs.confirmation == 'CONFIGURE PEACEPAD GOOGLE PROVIDER'
    name: Configure and verify Google without changing Apple
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: peacepad-v2-staging-ca
    steps:
      - name: Validate provider inputs before mutation
        shell: bash
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.PEACEPAD_GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_ADDITIONAL_CLIENT_IDS: ${{ secrets.PEACEPAD_GOOGLE_ADDITIONAL_CLIENT_IDS }}
          GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.PEACEPAD_GOOGLE_WEB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "rohvkyuxbnqzglaromms"
          test "$CONFIRMATION" = "CONFIGURE PEACEPAD GOOGLE PROVIDER"
          test -n "$GOOGLE_WEB_CLIENT_ID"
          test -n "$GOOGLE_ADDITIONAL_CLIENT_IDS"
          test -n "$GOOGLE_WEB_CLIENT_SECRET"
          [[ "$GOOGLE_WEB_CLIENT_ID" == *.apps.googleusercontent.com ]]
          echo 'All required provider inputs are present and structurally valid; no values were printed.'

      - name: Configure providers and read back redacted status
        shell: bash
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.PEACEPAD_GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_ADDITIONAL_CLIENT_IDS: ${{ secrets.PEACEPAD_GOOGLE_ADDITIONAL_CLIENT_IDS }}
          GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.PEACEPAD_GOOGLE_WEB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"
          before="$(mktemp)"
          after="$(mktemp)"
          payload="$(mktemp)"
          trap 'rm -f "$before" "$after" "$payload"' EXIT
          auth_header="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"

          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 60 \
            --header "$auth_header" --header 'accept: application/json' \
            "$api" --output "$before"
          jq -e '.external_email_enabled == true and (.disable_signup // false) == false' "$before" >/dev/null
          jq -e '
            .external_apple_enabled == true and
            ((.external_apple_client_id // "") | split(",") | index("ca.peacepad.family")) and
            .security_manual_linking_enabled == true
          ' "$before" >/dev/null

          jq -cn \
            --arg googleClient "$GOOGLE_WEB_CLIENT_ID" \
            --arg googleAdditional "$GOOGLE_ADDITIONAL_CLIENT_IDS" \
            --arg googleSecret "$GOOGLE_WEB_CLIENT_SECRET" \
            '{
              external_google_enabled: true,
              external_google_client_id: $googleClient,
              external_google_additional_client_ids: $googleAdditional,
              external_google_secret: $googleSecret,
              security_manual_linking_enabled: true
            }' >"$payload"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 60 --request PATCH \
            --header "$auth_header" --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --data-binary "@$payload" "$api" --output "$after"

          jq -e \
            --arg googleClient "$GOOGLE_WEB_CLIENT_ID" \
            --arg appleNative "ca.peacepad.family" '
              .external_email_enabled == true and
              (.disable_signup // false) == false and
              .external_google_enabled == true and
              .external_google_client_id == $googleClient and
              ((.external_google_additional_client_ids // "") | length > 0) and
              .external_apple_enabled == true and
              ((.external_apple_client_id // "") | split(",") | index($appleNative)) and
              .security_manual_linking_enabled == true
            ' "$after" >/dev/null
          jq -n '{
            providerConfiguration: "google-with-apple-preserved",
            emailEnabled: true,
            googleEnabled: true,
            appleEnabled: true,
            manualLinkingEnabled: true,
            signupSettingUnchanged: true,
            secretsPrinted: false
          }'
