name: "Continuous Improvement"
description: "Evidence-backed maintenance; autonomous only after agent-ready review."
title: "[CI] "
labels: ["continuous-improvement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Continuous Improvement
        The scheduled agent only picks up issues that also carry `agent-ready`.
        Dependencies, production configuration, auth, billing, legal/privacy,
        data migrations, native signing, and cloud builds require owner review.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      placeholder: "Fix the verified issue in one app or tightly related scope."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Observed evidence
      placeholder: "Exact file, command output, failing check, or reproducible behavior."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Scope (paths)
      placeholder: "APPS/peacepad/client/src/**"
    validations:
      required: true
  - type: input
    id: verification
    attributes:
      label: Verification command
      placeholder: "npm --prefix APPS/peacepad run check"
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk class
      options:
        - Low - eligible for agent-ready review
        - Medium - discovery and owner review only
        - High - owner-only change
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Do not touch
      placeholder: "Production, secrets, billing, legal text, signing, unrelated apps."
