name: Docs Guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docs-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enforce docs updates for code changes
        run: node scripts/docs-guard.mjs
