---
name: "Agent-Ready Task"
description: "A small, well-defined task for Copilot Coding Agent."
title: "[Agent-Ready] <concise summary>"
labels: ["agent-ready", "good first issue"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        **Agent-Ready Task**
        This issue is designed for Copilot Coding Agent. It should be:
        - Small and atomic (1-2 files, <30 min work)
        - Fully described with acceptance criteria
        - Not blocked by external dependencies
  - type: textarea
    id: task
    attributes:
      label: Task Description
      description: What should the agent do? Be specific.
      placeholder: "Implement X in Y file, following Z pattern."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be true for this to be considered done?
      placeholder: "- [ ] Code compiles\n- [ ] Tests pass\n- [ ] Feature works as described"
    validations:
      required: true
