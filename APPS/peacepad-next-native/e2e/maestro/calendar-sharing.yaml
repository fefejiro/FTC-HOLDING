appId: host.exp.Exponent
name: PeacePad calendar sharing simulator proof
---
- openLink: ${EXPO_URL}
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Calendar"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Share Parenting Time"
    direction: DOWN
    centerElement: true
- tapOn: "Share Parenting Time"
- scrollUntilVisible:
    element:
      text: "Share this calendar?"
    direction: DOWN
    centerElement: true
- tapOn: "Confirm sharing"
- scrollUntilVisible:
    element:
      text: "Make private Parenting Time"
    direction: UP
    centerElement: true
- assertVisible: "Make private Parenting Time"
