appId: host.exp.Exponent
name: PeacePad invitation QR simulator proof
---
- openLink: ${EXPO_URL}
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Family connection"
    timeout: 30000
- tapOn: "Create invitation"
- extendedWaitUntil:
    visible: "Invitation code P00001"
    timeout: 10000
- assertVisible: "Scannable invitation QR"
