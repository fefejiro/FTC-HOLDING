# Local CLI identity only. Remote project refs are stored by `supabase link`
# outside versioned source and differ per regional deployment.
project_id = "peacepad-v2-platform"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
