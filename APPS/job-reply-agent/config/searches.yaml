# Job Hunt OS — Search definitions
# Used by sourcing adapters. `companies` seeds direct ATS pulls
# (Greenhouse / Lever / Ashby). `searches` defines query intents
# used to score and filter incoming jobs.

companies:
  greenhouse:
    # Examples — replace with real targets. Slugs from boards.greenhouse.io/<slug>
    - shopify
    - faire
    - clio
    - hopper
    - benevity
    - wealthsimple
  lever:
    # Slugs from jobs.lever.co/<slug>
    - intelcom
    - properly
  ashby:
    # Slugs from jobs.ashbyhq.com/<slug>
    - cohere

searches:
  technical_program_manager:
    titles:
      - Technical Program Manager
      - Technical Project Manager
      - Program Manager, Enterprise Systems
      - Delivery Manager
      - Digital Transformation Manager
    keywords:
      - enterprise systems
      - integrations
      - API
      - SDLC
      - Agile
      - release
      - UAT
      - stakeholder
      - cloud
    locations:
      - Toronto
      - Ontario
      - Remote
      - Canada
      - United States
    minimum_rate: 70
    minimum_salary: 120000

  wms_supply_chain:
