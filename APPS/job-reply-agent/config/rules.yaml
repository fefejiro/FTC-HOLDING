      - WMS Warehouse Management Manhattan WMOS Manhattan Active Blue Yonder Project Manager Consultant Business Analyst Systems Analyst Remote Canada Toronto
      - Senior Business Systems Analyst Technical Business Analyst ERP WMS supply chain integration SaaS cloud Remote Canada Ontario
      - Senior QA Quality Engineer UAT Lead Test Lead integration API SQL regression end-to-end release validation Remote Canada
      - Technical Project Manager Technical Program Manager IT Project Manager implementation integration migration SaaS ERP WMS contract remote hybrid
      - Technical Consultant enterprise systems WMS supply chain ERP integration Canada remote hybrid
    max_jobs_per_run: 25
  robert_half:
    enabled: false
    keywords:
      - enterprise architect
      - technical program manager
      - business systems analyst
      - delivery program manager
      - product operations manager
    max_jobs_per_run: 25
  workopolis:
    enabled: false
    keywords:
      - enterprise architect
      - technical program manager
      - business systems analyst
      - delivery program manager
      - product operations manager
    max_jobs_per_run: 25
  mercor:
    enabled: false
    keywords:
      - enterprise architect
      - technical program manager
      - business systems analyst
      - delivery program manager
      - product operations manager
    max_jobs_per_run: 25

trusted_recruiter_domains:
  - example-recruiter.com

resume_tailoring:
  enabled: true
  template_path: "C:/FTC HOLDING/DOCS/Fejiro_Job_Reply_Agent_Resume_Bank/resumes/Fejiro_Efiuvwere_Default_Job_Agent_Resume_Template_RQ11067.docx"
  business_analysis_template_path: "C:/FTC HOLDING/DOCS/Fejiro_Job_Reply_Agent_Resume_Bank/resumes/Fejiro_Efiuvwere_Business_Analyst_Gold_Standard_Template.docx"
  output_dir: "C:/FTC HOLDING/DOCS/Fejiro_Job_Reply_Agent_Resume_Bank/resumes"
  attach_mode: docx_only
  auto_send: false
  auto_send_criteria:
