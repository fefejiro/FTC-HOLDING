      - Houston IT project manager
      - Houston business systems manager
      - Houston ERP project manager
      - Houston implementation manager
      - Houston service delivery manager
      - enterprise architect
      - technical program manager
      - business systems analyst
      - delivery program manager
      - product operations manager
      - transformation manager
      - implementation program manager
    max_jobs_per_run: 10
  linkedin:
    enabled: true
