automation:
  enabled: true
  mode: approval_required
  timezone: America/Toronto
  max_drafts_per_day: 50
  max_sends_per_day: 50
  schedule:
    business_hours_start: 7
    business_hours_end: 22
    business_hours_interval_minutes: 60
    after_hours_interval_minutes: 240
    quiet_hours_start: 23
    quiet_hours_end: 7
    no_auto_send_weekdays: []

filters:
  min_match_score: 55
  score_bands:
    auto_send_min: 75
    draft_min: 69
    needs_review_min: 55
  labels:
    inbound: JOB AGENT/Recruiter Inbound
    drafted: JOB AGENT/Drafted
    needs_review: JOB AGENT/Needs Review
    approve_send: JOB AGENT/Approved Send
    sent: JOB AGENT/Sent
    skipped: JOB AGENT/Skipped
    blocked: JOB AGENT/Blocked
    approved: JOB AGENT/Approved Send
    trusted_recruiter: JOB AGENT/Trusted Recruiter
    resume_generated: JOB AGENT/Resume Generated
    error: JOB AGENT/Error

risk_controls:
  block_keywords:
    - sin
    - ssn
    - passport
    - date of birth
    - full address
    - banking information
    - right to represent
    - payment to apply
    - unknown sender attachment
    - suspicious link
  require_review_keywords:
    - exclusive representation
    - urgent share details
    - salary expectation

scraper:
  enabled: true
  dice:
    enabled: true
    keywords:
      - IT manager retail systems
      - service delivery manager retail systems
      - program manager enterprise systems
      - ERP WMS POS manager
      - QA manager retail systems
      - enterprise architect
      - technical program manager
      - business systems analyst
      - delivery program manager
      - product operations manager
      - transformation manager
      - implementation program manager
    max_jobs_per_run: 25
  indeed:
    enabled: false
    keywords:
      - enterprise architect
      - technical program manager
      - business systems analyst
      - delivery program manager
      - product operations manager
      - transformation manager
      - implementation program manager
    max_jobs_per_run: 25
  linkedin:
    enabled: false
    keywords:
      - enterprise architect
      - technical program manager
      - business systems analyst
      - delivery program manager
      - product operations manager
      - transformation manager
      - implementation program manager
    max_jobs_per_run: 25
  robert_half:
    enabled: false
    keywords:
      - enterprise architect
      - technical program manager
      - business systems analyst
      - delivery program manager
      - product operations manager
    max_jobs_per_run: 25
  workopolis:
    enabled: false
    keywords:
      - enterprise architect
      - technical program manager
      - business systems analyst
      - delivery program manager
      - product operations manager
    max_jobs_per_run: 25
  mercor:
    enabled: false
    keywords:
      - enterprise architect
      - technical program manager
      - business systems analyst
      - delivery program manager
      - product operations manager
    max_jobs_per_run: 25

trusted_recruiter_domains:
  - example-recruiter.com

resume_tailoring:
  enabled: true
  template_path: "C:/FTC HOLDING/DOCS/Fejiro_Job_Reply_Agent_Resume_Bank/resumes/Fejiro_Efiuvwere_Canadian_Tire_Manager_Network_Analytics_Resume.docx"
  output_dir: "C:/FTC HOLDING/DOCS/Fejiro_Job_Reply_Agent_Resume_Bank/resumes"
  attach_mode: docx_only
  auto_send: false
  auto_send_criteria:
    min_score: 75
    require_recruiter_name: true
    require_clean_role_title: true
    require_resume_generated: true
    max_body_words: 160
    no_html_artifacts: true
    no_sensitive_requests: true
