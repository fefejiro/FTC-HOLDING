    <!-- CRITICAL: Suppress Vite HMR WebSocket errors BEFORE Vite loads (runs immediately) -->
    <script>
      // Suppress unhandled promise rejections from Vite HMR
      window.addEventListener('unhandledrejection', event => {
        const msg = event.reason?.message || String(event.reason || '');
        if (msg.includes("WebSocket") && msg.includes("localhost:undefined")) {
          event.preventDefault();
          console.debug('[Dev] Suppressed Vite HMR WebSocket error (harmless)');
        }
      }, true); // Use capture phase to catch early
      
      // Also suppress console errors from Vite
      const originalError = console.error;
      console.error = function(...args) {
        const errorStr = String(args[0]);
        if (errorStr?.includes?.("WebSocket") && errorStr?.includes?.("localhost:undefined")) {
          console.debug('[Dev] Suppressed Vite HMR error:', args[0]);
          return;
        }
        originalError.apply(console, args);
      };
    </script>

    <!-- Auto version check and refresh (runs before React loads) -->
    <script>
      (async function() {
        try {
          const host = window.location.hostname.replace(/\.$/, "").toLowerCase();
          const isPeacepadWebHost = host === "peacepad.ca" || host === "www.peacepad.ca";
          const apiBase = isPeacepadWebHost
            ? `${window.location.protocol}//api.peacepad.ca`
            : window.location.origin;
          const response = await fetch(`${apiBase}/api/version`);
          const { buildId } = await response.json();
          const storedVersion = localStorage.getItem('peacepad_build_id');
          
          if (storedVersion && storedVersion !== buildId) {
            // Version changed - clear caches and reload
            console.log('[Version Check] New version detected, refreshing...');
            
            // Clear all caches
            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(cacheNames.map(name => caches.delete(name)));
            }
            
            // Unregister service workers
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(reg => reg.unregister()));
            }
            
            // Update version and reload
            localStorage.setItem('peacepad_build_id', buildId);
            window.location.reload(true);
            return;
          }
          
          // Store current version
          localStorage.setItem('peacepad_build_id', buildId);
        } catch (error) {
          console.error('[Version Check] Failed:', error);
        }
      })();
    </script>

    <!-- Service Worker Registration (Production Only) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const hostname = window.location.hostname;
          const isDevelopment = hostname.includes('dev.') || hostname.includes('localhost') || hostname.includes('replit.dev');
          
          if (isDevelopment) {
            // On development domains, UNREGISTER any existing service workers
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              registrations.forEach((registration) => {
                registration.unregister();
                console.log('[Dev] Service worker unregistered:', registration);
              });
            });
            console.log('[Dev] Service worker disabled on development domain');
          } else {
            // On production domains, register the service worker
            navigator.serviceWorker.register('/sw.js')
              .then((registration) => {
                console.log('[Prod] SW registered:', registration);
              })
              .catch((error) => {
                console.log('[Prod] SW registration failed:', error);
              });
          }
        });
      }
    </script>
