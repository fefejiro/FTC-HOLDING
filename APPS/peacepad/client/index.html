    <!-- CRITICAL: Suppress Vite HMR WebSocket errors BEFORE Vite loads (runs immediately) -->
    <script>
      // Suppress unhandled promise rejections from Vite HMR
      window.addEventListener('unhandledrejection', event => {
        const msg = event.reason?.message || String(event.reason || '');
        if (msg.includes("WebSocket") && msg.includes("localhost:undefined")) {
          event.preventDefault();
          console.debug('[Dev] Suppressed Vite HMR WebSocket error (harmless)');
        }
      }, true); // Use capture phase to catch early
      
      // Also suppress console errors from Vite
      const originalError = console.error;
      console.error = function(...args) {
        const errorStr = String(args[0]);
        if (errorStr?.includes?.("WebSocket") && errorStr?.includes?.("localhost:undefined")) {
          console.debug('[Dev] Suppressed Vite HMR error:', args[0]);
          return;
        }
        originalError.apply(console, args);
      };
    </script>

    <!-- Frontend build metadata check (runs before React loads) -->
    <script>
      (async function() {
        try {
          const response = await fetch(`/_peacepad/build-meta.json?ts=${Date.now()}`, {
            method: 'GET',
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache'
            }
          });

          if (!response.ok) return;

          const payload = await response.json();
          const webBuildId = typeof payload?.webBuildId === 'string' ? payload.webBuildId.trim() : '';
          if (!webBuildId) return;

          const buildKey = 'peacepad_web_build_id';
          const pendingKey = 'peacepad_pending_web_build_id';
          const deferredKey = 'peacepad_update_deferred';
          const forceAfterKey = 'peacepad_update_force_after';
          const forceDelayMs = 24 * 60 * 60 * 1000;
          const storedBuildId = localStorage.getItem(buildKey);

          if (!storedBuildId) {
            localStorage.setItem(buildKey, webBuildId);
            localStorage.removeItem(pendingKey);
            localStorage.removeItem(deferredKey);
            localStorage.removeItem(forceAfterKey);
            return;
          }

          if (storedBuildId !== webBuildId) {
            localStorage.setItem(pendingKey, webBuildId);
            if (!localStorage.getItem(forceAfterKey)) {
              localStorage.setItem(forceAfterKey, String(Date.now() + forceDelayMs));
            }

            window.dispatchEvent(
              new CustomEvent('peacepad:web-update-detected', {
                detail: { webBuildId }
              })
            );
            return;
          }

          localStorage.removeItem(pendingKey);
          localStorage.removeItem(deferredKey);
          localStorage.removeItem(forceAfterKey);
        } catch (error) {
          console.error('[Build Meta Check] Failed:', error);
        }
      })();
    </script>
